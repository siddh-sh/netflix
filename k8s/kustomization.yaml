apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netflix

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - monitoring/prometheus.yaml
  - monitoring/grafana.yaml

images:
  - name: ghcr.io/siddh-sh/netflix
    newTag: latest

# Grafana config is shared with docker-compose; build with:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s | kubectl apply -f -
configMapGenerator:
  - name: grafana-datasources
    files:
      - ../monitoring/grafana/provisioning/datasources/prometheus.yml
  - name: grafana-dashboard-provider
    files:
      - ../monitoring/grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-dashboards
    files:
      - ../monitoring/grafana/dashboards/netflix.json

secretGenerator:
  - name: grafana-admin
    literals:
      - user=admin
      - password=change-me
